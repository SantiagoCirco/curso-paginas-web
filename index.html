<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Índice del Curso</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 650px;
    }

    header {
      margin-bottom: 2rem;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 1rem;
    }

    h1 {
      font-size: 1.875rem;
      color: #0f172a;
      margin-bottom: 0.5rem;
    }

    p.subtitle {
      color: #64748b;
      font-size: 0.95rem;
    }

    .links-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .card-link {
      display: flex;
      flex-direction: column;
      padding: 1.25rem;
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.15s ease;
    }

    .card-link:hover {
      border-color: #2563eb;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.08);
      transform: translateY(-2px);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.35rem;
    }

    .card-title {
      font-size: 1.125rem;
      font-weight: 600;
      color: #1e293b;
    }

    .card-link:hover .card-title {
      color: #2563eb;
    }

    .arrow-icon {
      color: #2563eb;
      font-weight: bold;
      transition: transform 0.2s ease;
    }

    .card-link:hover .arrow-icon {
      transform: translateX(4px);
    }

    .card-description {
      font-size: 0.875rem;
      color: #64748b;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Índice del Curso</h1>
      <p class="subtitle">Seleccioná un módulo para ingresar a la clase correspondiente.</p>
    </header>

    <main>
      <ul id="index-list" class="links-list"></ul>
    </main>
  </div>

  <script>
    // ARRAY EXTENSIBLE: Solo agregás o modificás objetos en esta lista
    const PAGINAS_CURSO = [
      {
        titulo: 'Repaso',
        descripcion: 'Conceptos fundamentales y repaso general del contenido previo.',
        ruta: './repaso'
      },
      {
        titulo: 'Formularios',
        descripcion: 'Captura de datos, validaciones y manejo de eventos.',
        ruta: './formularios'
      },
      /* Para agregar una clase nueva a futuro, desmarcar e insertar datos:
      {
        titulo: 'Módulo 3: Asincronía y APIs',
        descripcion: 'Uso de fetch, promesas y consumo de servicios externos.',
        ruta: './asincronia'
      },
      */
    ];

    // Función para renderizar el índice dinámicamente
    function renderizarIndice() {
      const contenedor = document.getElementById('index-list');
      contenedor.innerHTML = '';

      PAGINAS_CURSO.forEach(pagina => {
        const li = document.createElement('li');

        li.innerHTML = `
          <a href="${pagina.ruta}" class="card-link">
            <div class="card-header">
              <span class="card-title">${pagina.titulo}</span>
              <span class="arrow-icon">Ir →</span>
            </div>
            ${pagina.descripcion ? `<p class="card-description">${pagina.descripcion}</p>` : ''}
          </a>
        `;

        contenedor.appendChild(li);
      });
    }

    // Inicialización
    renderizarIndice();
  </script>

</body>
</html>
